schema_version = "sg_dataoverview_country_v1"

[osm_snapshot]
url = "https://download.geofabrik.de/australia-oceania/australia/new-south-wales-latest.osm.pbf"
scope = "new-south-wales"

[ntl]
dataset_id = "NOAA/VIIRS/DNB/ANNUAL_V22"
bands = ["average_masked","cf_cvg"]
date_range = ["2024-01-01","2025-01-01"]
composite_method = "single_image"
credential_env = "GEE_SERVICE_ACCOUNT_KEY_PATH"

[regions]
source_key = "SA3"
source_path = "data/datasets/2_derived/au/bplus/regions_sa3.gpkg"
source_layer = "regions_sa3"
group_key = "loc_key"

[canonical]
regions = "data/datasets/2_derived/au/bplus/regions_sa3.gpkg"
stations = "data/datasets/2_derived/au/bplus/stations.gpkg"

[[regions.items]]
id = "Central_Coast"
source_key_order = ["10201","10202"]

[[regions.items]]
id = "Hunter_Valley_exc_Newcastle"
source_key_order = ["10601","10603","10604","10602"]

[[regions.items]]
id = "Newcastle_and_Lake_Macquarie"
source_key_order = ["11102","11101","11103"]

[[regions.items]]
id = "Sydney_City_and_Inner_South"
source_key_order = ["11701","11702","11703"]

[[regions.items]]
id = "Sydney_Eastern_Suburbs"
source_key_order = ["11802","11801"]

[[regions.items]]
id = "Sydney_Inner_South_West"
source_key_order = ["11904","11903","11901","11902"]

[[regions.items]]
id = "Sydney_Inner_West"
source_key_order = ["12003","12002","12001"]

[[regions.items]]
id = "Sydney_North_Sydney_and_Hornsby"
source_key_order = ["12104","12101","12103","12102"]

[[regions.items]]
id = "Sydney_Northern_Beaches"
source_key_order = ["12201","12203","12202"]

[[regions.items]]
id = "Sydney_Parramatta"
