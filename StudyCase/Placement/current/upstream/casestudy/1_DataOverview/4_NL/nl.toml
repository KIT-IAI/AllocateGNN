[products.stations]
category = "station_register"
depends_on = ["nl.regions.derive"]
produces = ["data/datasets/2_derived/nl/bplus/buurt_pseudo_stations.gpkg", "data/datasets/2_derived/nl/lineage/equipment_register.gpkg", "data/datasets/2_derived/nl/audit/crosswalk.csv"]
semantics = "buurt-level formal pseudo-stations; equipment retained only as lineage and diagnostic"

[products.gate_a]
category = "station_register"
depends_on = ["nl.regions.derive", "nl.stations.derive"]
produces = ["data/datasets/2_derived/nl/audit/gate_a.json"]
semantics = "NL admission Gate A"

[products.grid_skeleton]
category = "boundaries_grid"
depends_on = ["nl.gate_a.derive"]
produces = ["data/datasets/2_derived/nl/audit/engineering_admission.json", "data/datasets/2_derived/nl/authority/analysis_region_inventory.json"]
semantics = "feature-free grid, canonical assignment, proximity and graph-size dry-run"

[products.grid]
category = "boundaries_grid"
depends_on = ["nl.grid_skeleton.derive"]
produces = ["data/datasets/2_derived/nl/grid_bplus/bundles"]
semantics = "frozen analysis-region grid bundles"

[products.features]
category = "features_cuz"
depends_on = ["nl.grid.derive", "nl.osm_snapshot.download", "nl.ntl.download"]
produces = ["data/datasets/2_derived/nl/features_bplus/extracted"]
semantics = "land-use, Built-S, C/U/Z and NTL arrays"

[products.inventory]
category = "features_cuz"
