[pytest]
testpaths = tests
markers =
    produce: artifact-production, derivation, acquisition, and HPC support tests
    consume: scientific consumers such as training, inference, analysis, and planning
    gate: repository-layout, frozen-contract, and admission gates
    slow: tests intentionally excluded from the fast local feedback loop
    local_data: requires landed source or derived data on this machine
    local_results: requires an explicitly selected completed local smoke result
    formal_results: reads inherited formal artifacts without changing them
