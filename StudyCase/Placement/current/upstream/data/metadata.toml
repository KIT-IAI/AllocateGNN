# 数据集唯一登记(入库)—— metadata.toml
# 2026-08-10 拍板(参照 granularitycasestudy 约定):原 metadata.json 转 TOML。
# 本文件 = **人写**的每数据集事实(layer/path/country/source/regenerate/license/validation);
# 下载目录中的 manifest_*_landing.json 只记录本机落地字节，不作运行时校验。
# 文件名与落地路径由 casestudy/1_DataOverview/<国家目录>/<cc>.toml 的台账和 sglib.dataoverview.processing 决定,本文件不登记文件清单。
# 兼任仓库根定位 fail-fast 标记(sglib.core.infra.paths.find_repo_root 探测本文件)。

[_meta]
schema = "spatialgranularity:data-metadata/2.0"
note = "数据集登记表:每个落地到 data/datasets/ 的数据集在此登记一条,登记时机 = 数据落地的同一提交;字段见 _示例。"
deanchoring = "所有数据从公开源重新下载；不使用旧字节或哈希作为运行闸门。DataOverview 当前通过三国 PBF、GHSL 官方瓦片和离线 NTL GeoTIFF 再生。"

